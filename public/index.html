<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>planview</title>
    <link rel="stylesheet" href="/static/vendor/highlight-theme.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/sessions.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📋</text></svg>"
    />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>planview</h1>
        <span id="status" title="connection to the planview daemon"></span>
      </header>
      <div id="agterm-offline" hidden>agterm is not reachable</div>
      <nav id="sess-tree" aria-label="Sessions"></nav>
    </aside>

    <main id="pane">
      <section id="session-view">
        <header id="sess-header">
          <span id="sess-dot" class="dot"></span>
          <div id="sess-titles">
            <h2 id="sess-title">no session</h2>
            <div id="sess-meta"></div>
          </div>
          <!-- What am I looking at: which pane of this session. Navigation, not an action. -->
          <div id="pane-chips"></div>
          <div id="menu-wrap">
            <button id="sess-menu-button" class="chip" title="session actions" aria-haspopup="true">⋯</button>
            <div id="sess-menu" hidden></div>
          </div>
        </header>

        <div id="screen-wrap">
          <div id="term-scroll">
            <!-- Whose past this is, stated where the past begins. -->
            <div id="feed-note" hidden></div>
            <div id="past"><div id="past-top"></div></div>
            <!-- The prompt sits where it happened: under everything the feed has, above the live
                 frame. The plan you are being asked about comes with it, in full — the terminal
                 frame only ever shows the tail of it. -->
            <div id="approve-strip" hidden>
              <div id="approve-plan"></div>
              <div id="approve-bar">
                <span id="approve-note"></span>
                <div id="approve-buttons"></div>
              </div>
            </div>
            <pre id="frame" tabindex="-1"></pre>
          </div>
          <!-- Only speaks up when the mirror is behind or reconnecting. -->
          <div id="frame-status" hidden></div>
          <button id="live-pill" hidden>↓ live</button>
        </div>

        <form id="composer">
          <!-- One question — what happens when I press a key — answered in one place. -->
          <div id="input-mode">
            <button id="mode-message" type="button" class="mode-key">✎ сообщение</button>
            <button id="mode-keys" type="button" class="mode-key">⌨ клавиши</button>
          </div>
          <textarea
            id="composer-input"
            rows="1"
            placeholder="Написать в эту сессию — Enter отправляет, Shift+Enter переносит строку"
          ></textarea>
          <div id="keys-strip" hidden></div>
          <div id="quick-keys">
            <button id="key-esc" type="button" class="chip danger" title="послать Escape">Esc</button>
            <button id="key-ctrlc" type="button" class="chip danger" title="послать Ctrl+C">^C</button>
          </div>
          <button id="composer-send" type="submit">⏎</button>
        </form>
        <div id="composer-note"></div>
      </section>
    </main>

    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/highlight.min.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
